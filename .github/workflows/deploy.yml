name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          envs: GH_TOKEN,EC2_ENV_FILE,DEPLOY_REPOSITORY
          script: |
            set -e
            AUTH_HEADER="Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
            if [ -d "$HOME/app/.git" ]; then
              cd "$HOME/app"
              git remote set-url origin "https://github.com/${DEPLOY_REPOSITORY}.git"
              git -c http.extraheader="$AUTH_HEADER" pull --ff-only origin main
            elif [ ! -e "$HOME/app" ]; then
              git -c http.extraheader="$AUTH_HEADER" clone "https://github.com/${DEPLOY_REPOSITORY}.git" "$HOME/app"
              cd "$HOME/app"
            else
              echo "ERROR: $HOME/app exists but is not a Git checkout."
              exit 1
            fi
            if [ -n "${EC2_ENV_FILE:-}" ]; then
              printf '%s\n' "$EC2_ENV_FILE" > .env
              chmod 600 .env
            fi
            test -f .env || { echo "ERROR: $HOME/app/.env is missing."; exit 1; }
            BUILD_REVISION=$(git rev-parse HEAD)
            printf '\nBUILD_REVISION=%s\n' "$BUILD_REVISION" >> .env
            mkdir -p "$HOME/.docker/cli-plugins"
            case "$(uname -m)" in
              x86_64) COMPOSE_ARCH=x86_64 ;;
              aarch64|arm64) COMPOSE_ARCH=aarch64 ;;
              *) echo "ERROR: Unsupported EC2 architecture: $(uname -m)"; exit 1 ;;
            esac
            echo "Checking Docker CLI plugins."
            if ! timeout 15s docker compose version >/dev/null 2>&1; then
              compose_tmp="$HOME/.docker/cli-plugins/docker-compose.tmp.$$"
              rm -f "$compose_tmp"
              curl --fail --silent --show-error --location --connect-timeout 10 --max-time 45 \
                "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}" \
                -o "$compose_tmp" || {
                df -h
                df -i
                exit 1
              }
              mv "$compose_tmp" "$HOME/.docker/cli-plugins/docker-compose"
              chmod +x "$HOME/.docker/cli-plugins/docker-compose"
            fi
            echo "Docker CLI plugins are ready."
            echo "Checking Docker daemon."
            if ! timeout 30s docker version; then
                echo "Docker daemon is unresponsive; restarting Docker and cleaning host caches."
                timeout 60s sudo systemctl restart docker || true
                timeout 60s sudo journalctl --vacuum-size=200M || true
                timeout 60s sudo dnf clean all || true
                timeout 60s docker version || true
              fi
              if ! timeout 30s docker version; then
                echo "ERROR: Docker daemon did not respond after restart."
              systemctl is-active docker || true
              systemctl status docker --no-pager --full || true
              ls -l /var/run/docker.sock || true
              df -h
              df -i
              exit 1
            fi
            timeout 30s docker compose version
            timeout 60s docker compose config --quiet
            trap 'docker compose ps --all; docker compose logs --tail=100' ERR
            export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}"
              timeout 3m docker system prune -af || true
            echo "Starting Compose deployment for $BUILD_REVISION."
            if ! timeout --foreground 12m docker compose up -d --build; then
              if docker compose logs kafka 2>&1 | grep -q "InconsistentClusterIdException"; then
                echo "Kafka and ZooKeeper volumes have different cluster IDs; recreating Kafka infrastructure volumes."
                docker compose down
                kafka_volumes=$(docker volume ls -q \
                  --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
                  --filter "label=com.docker.compose.volume=kafka-data")
                zookeeper_volumes=$(docker volume ls -q \
                  --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" \
                  --filter "label=com.docker.compose.volume=zookeeper-data")
                for volume in $kafka_volumes $zookeeper_volumes; do
                  docker volume rm "$volume"
                done
                timeout --foreground 12m docker compose up -d --build
              else
                docker compose ps --all
                docker compose logs --tail=100
                exit 1
              fi
            fi
            for attempt in $(seq 1 60); do
              deployed_revision=$(curl -fsS http://127.0.0.1:8000/health/version 2>/dev/null | sed -n 's/.*"build_revision":"\([^"]*\)".*/\1/p' || true)
              readiness=$(curl -fsS http://127.0.0.1:8000/health/ready 2>/dev/null || true)
              if [ "$deployed_revision" = "$BUILD_REVISION" ] && printf '%s' "$readiness" | grep -q '"status":"ready"'; then
                echo "Deployment verified at revision $BUILD_REVISION with all dependencies ready."
                exit 0
              fi
              sleep 5
            done
            echo "ERROR: API did not report deployed revision $BUILD_REVISION."
            docker compose ps --all
            docker compose logs api --tail=100
            exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
          DEPLOY_REPOSITORY: ${{ github.repository }}