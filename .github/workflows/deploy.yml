name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,EC2_ENV_FILE,DEPLOY_REPOSITORY
          script: |
            set -e
            AUTH_HEADER="Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
            if [ -d "$HOME/app/.git" ]; then
              cd "$HOME/app"
              git remote set-url origin "https://github.com/${DEPLOY_REPOSITORY}.git"
              git -c http.extraheader="$AUTH_HEADER" pull --ff-only origin main
            elif [ ! -e "$HOME/app" ]; then
              git -c http.extraheader="$AUTH_HEADER" clone "https://github.com/${DEPLOY_REPOSITORY}.git" "$HOME/app"
              cd "$HOME/app"
            else
              echo "ERROR: $HOME/app exists but is not a Git checkout."
              exit 1
            fi
            if [ -n "${EC2_ENV_FILE:-}" ]; then
              printf '%s\n' "$EC2_ENV_FILE" > .env
              chmod 600 .env
            fi
            test -f .env || { echo "ERROR: $HOME/app/.env is missing."; exit 1; }
            mkdir -p "$HOME/.docker/cli-plugins"
            case "$(uname -m)" in
              x86_64) DOCKER_ARCH=amd64; COMPOSE_ARCH=x86_64 ;;
              aarch64|arm64) DOCKER_ARCH=arm64; COMPOSE_ARCH=aarch64 ;;
              *) echo "ERROR: Unsupported EC2 architecture: $(uname -m)"; exit 1 ;;
            esac
            curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}" \
              -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
            curl -fsSL "https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-${DOCKER_ARCH}" \
              -o "$HOME/.docker/cli-plugins/docker-buildx"
            chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
            docker version
            docker compose version
            docker buildx version
            docker compose config --quiet
            trap 'docker compose ps --all; docker compose logs --tail=100' ERR
            docker compose down
            docker compose up -d --build
        env:
          GH_TOKEN: ${{ github.token }}
          EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
          DEPLOY_REPOSITORY: ${{ github.repository }}