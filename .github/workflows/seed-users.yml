name: Seed Demo Users

on:
  workflow_dispatch:

jobs:
  seed-users:
    runs-on: ubuntu-latest
    steps:
      - name: Seed users on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd "$HOME/app"
            test -f .env || { echo "ERROR: $HOME/app/.env is missing."; exit 1; }
            docker compose run --rm api python -m scripts.seed_users
            echo "Demo users seeded successfully."
