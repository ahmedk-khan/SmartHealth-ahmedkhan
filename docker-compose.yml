services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - postgres
      - temporal
      - redis

  celery-worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - temporal

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - TEMPORAL_BROKER=sqlite
      - TEMPORAL_WEB_PORT=7233
      - TEMPORAL_GRPC_PORT=7233
      - TEMPORAL_UI_ENABLED=true
      - TEMPORAL_DB=sqlite
      - TEMPORAL_DB_PATH=/data/temporal.db
    volumes:
      - temporal-data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  temporal-data: